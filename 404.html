<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashley &amp; Tristan</title>
<style>
  html,body{ margin:0; padding:0; height:100%; background:#0c0b09; }
</style>
<script>
  // GitHub Pages serves this file for any path that isn't a real file,
  // which is what lets a clean personalized link like
  // ashleyandtristan.com/abbyroberts work. This grabs that path and
  // bounces (instantly, before anything renders) to the real page with
  // it as the ?guest= code the site already knows how to read.
  (function () {
    var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    var dest = '/';
    if (path) {
      dest += '?guest=' + encodeURIComponent(path.toLowerCase());
    }
    window.location.replace(dest + window.location.hash);
  })();
</script>
</head>
<body></body>
</html>
